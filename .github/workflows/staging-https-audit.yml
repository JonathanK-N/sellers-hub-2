name: AfriMarket staging HTTPS audit
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Explicitly approved SHA currently running on staging
        required: true
        default: '779ec1244bb25077e639ffc4dbe64f17ce344024'
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  staging-https-pages:
    if: github.event_name == 'workflow_dispatch' || ((github.event.label.name == 'staging-https-audit' || github.event.label.name == 'staging-https-home-diagnostic') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_QA_SOURCE_SHA: '2806d719bf0edbdc31ebd32ab0887e1fb4dc40cb'
      STAGING_QA_PAGE_FILTER: ${{ github.event.label.name == 'staging-https-home-diagnostic' && 'accueil' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned audit tools
        run: npm install --prefix "$RUNNER_TEMP/afrimarket-https-tools" lighthouse@13.5.0 playwright@1.60.0
      - name: Validate protected sessions and measure seven real HTTPS pages
        env:
          STAGING_QA_TOKEN_BUYER: ${{ secrets.STAGING_QA_TOKEN_BUYER }}
          STAGING_QA_TOKEN_SELLER: ${{ secrets.STAGING_QA_TOKEN_SELLER }}
          STAGING_QA_TOKEN_ADMIN: ${{ secrets.STAGING_QA_TOKEN_ADMIN }}
        run: |
          set -euo pipefail
          umask 077
          export QA_PRIVATE_ROOT="$RUNNER_TEMP/afrimarket-https-private"
          export LIGHTHOUSE_PACKAGE="$RUNNER_TEMP/afrimarket-https-tools/node_modules/lighthouse/package.json"
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/afrimarket-https-tools/node_modules/playwright"
          mkdir -p "$QA_PRIVATE_ROOT" staging-https-evidence
          if [ "$STAGING_QA_PAGE_FILTER" != "accueil" ]; then
            node scripts/staging_ci_sessions.cjs "$QA_PRIVATE_ROOT/sessions"
          else
            mkdir -p "$QA_PRIVATE_ROOT/sessions"
          fi
          node scripts/dynamic_https_lighthouse_readonly.cjs "$QA_PRIVATE_ROOT/sessions" "$QA_PRIVATE_ROOT/raw-reports" staging-https-evidence/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-https-summary-${{ github.run_id }}
          path: staging-https-evidence/summary.json
          if-no-files-found: warn
